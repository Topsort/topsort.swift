name: Format
on:
  pull_request:
    paths:
      - "**/*.swift"
      - ".github/workflows/validate-format.yml"

jobs:
  format:
    name: Validate Swift formatting
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: swiftformat --lint --reporter github-actions-log .
